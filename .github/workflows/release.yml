# Automated release with npm provenance.
#
# Trigger: push a version tag `vX.Y.Z` (created by the normal release flow —
# bump package.json, rebuild bundles, commit, tag, push). This workflow then
# gates the tag and publishes to npm from GitHub Actions with **provenance**, so
# npmjs.com shows a verifiable link proving the tarball was built from this exact
# commit — "the published package == the audited source", publicly checkable.
#
# This replaces the manual `docker run node:20 ... npm publish` flow. It removes
# the OTP/credential dance and the trust-me-it-matches-source gap.
#
# Auth is TOKENLESS via npm **OIDC Trusted Publishing** — no NPM_TOKEN secret. The
# workflow's OIDC identity (id-token: write) is exchanged for a short-lived npm token
# at publish time, and provenance is automatic. (npm removed classic/automation tokens
# in Nov 2025; trusted publishing is the modern path and avoids granular-token scoping.)
#
# ONE-TIME SETUP (repo admin, on npmjs.com): @smartledger/bsv -> Settings ->
# Trusted Publisher -> GitHub Actions -> repository `codenlighten/smartledger-bsv`,
# workflow `release.yml`. No secret needed. Requires npm >= 11.5.1 (installed below).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # REQUIRED: lets npm mint the OIDC token for provenance.

jobs:
  publish:
    name: Publish to npm (with provenance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 20
        # Build/parity stay on Node 20 (matches the committed bundles). registry-url points
        # npm at npmjs.org in .npmrc (needed for the OIDC exchange); no token is supplied —
        # OIDC trusted publishing mints a short-lived one.
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Upgrade npm for OIDC trusted publishing
        # Node 20 ships npm 10.8; OIDC trusted publishing needs npm >= 11.5.1. Pin to the
        # 11.x line — npm@latest is 12.x which requires Node 22+ (incompatible with Node 20).
        run: npm install -g 'npm@^11.5.1'

      - name: Install
        run: npm ci

      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: exists
        run: |
          if npm view "@smartledger/bsv@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::warning::version already published — nothing to do"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Gates — the same checks the branch CI enforces, re-run at publish time so a
      # tag can never ship code/bundles that don't pass.
      - name: Test suite
        if: steps.exists.outputs.already == 'false'
        run: npm test

      - name: Lint (audited modules)
        if: steps.exists.outputs.already == 'false'
        run: npx standard lib/ordinals lib/spv lib/smart_contract/pushtx.js lib/smart_contract/token.js test/ordinals test/security test/types

      - name: Build bundles and verify parity with source
        if: steps.exists.outputs.already == 'false'
        run: |
          npm run build-all
          if ! git diff --exit-code -- '*.min.js' '*.bundle.js'; then
            echo "::error::committed bundles are not a reproducible build of lib/ — run npm run build-all and commit"
            exit 1
          fi

      # prepublishOnly rebuilds bundles again (idempotent); publish with provenance.
      - name: OIDC preflight (diagnostic)
        if: steps.exists.outputs.already == 'false'
        run: |
          echo "npm: $(npm --version)"
          echo "id-token request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "id-token request token present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-NO}"

      - name: Publish (OIDC trusted publishing + provenance)
        if: steps.exists.outputs.already == 'false'
        # No token: npm exchanges the GitHub OIDC id-token for a short-lived publish
        # token via the configured trusted publisher, and attaches provenance.
        run: npm publish --provenance --access public
