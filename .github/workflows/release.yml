# Automated release with npm provenance.
#
# Trigger: push a version tag `vX.Y.Z` (created by the normal release flow —
# bump package.json, rebuild bundles, commit, tag, push). This workflow then
# gates the tag and publishes to npm from GitHub Actions with **provenance**, so
# npmjs.com shows a verifiable link proving the tarball was built from this exact
# commit — "the published package == the audited source", publicly checkable.
#
# This replaces the manual `docker run node:20 ... npm publish` flow. It removes
# the OTP/credential dance and the trust-me-it-matches-source gap.
#
# ONE-TIME SETUP (repo admin): add an npm **Automation** access token as the
# Actions secret `NPM_TOKEN` (Settings -> Secrets and variables -> Actions).
# Automation tokens bypass 2FA, which provenance/CI publishing requires.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # REQUIRED: lets npm mint the OIDC token for provenance.

jobs:
  publish:
    name: Publish to npm (with provenance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: npm ci

      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: exists
        run: |
          if npm view "@smartledger/bsv@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::warning::version already published — nothing to do"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Gates — the same checks the branch CI enforces, re-run at publish time so a
      # tag can never ship code/bundles that don't pass.
      - name: Test suite
        if: steps.exists.outputs.already == 'false'
        run: npm test

      - name: Lint (audited modules)
        if: steps.exists.outputs.already == 'false'
        run: npx standard lib/ordinals lib/spv lib/smart_contract/pushtx.js lib/smart_contract/token.js test/ordinals test/security test/types

      - name: Build bundles and verify parity with source
        if: steps.exists.outputs.already == 'false'
        run: |
          npm run build-all
          if ! git diff --exit-code -- '*.min.js' '*.bundle.js'; then
            echo "::error::committed bundles are not a reproducible build of lib/ — run npm run build-all and commit"
            exit 1
          fi

      # prepublishOnly rebuilds bundles again (idempotent); publish with provenance.
      - name: Publish
        if: steps.exists.outputs.already == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
